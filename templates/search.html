<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Search — Bull's Eye</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1020;
    --ink: #e8ecf5;
    --ink-dim: #8a94ad;
    --accent: #25b95f;
    --accent-glow: rgba(37, 185, 95, 0.25);
    --danger: #ff6b6b;
    --line: rgba(138, 148, 173, 0.15);
    --panel: rgba(17, 25, 50, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', sans-serif; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    filter: blur(90px); top: -250px; left: 50%; transform: translateX(-50%);
    z-index: 0; pointer-events: none;
  }
  nav {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 48px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  .brand img { width: 38px; height: 38px; }
  .brand-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
  .brand-text .dot { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 22px; }
  .nav-right a {
    color: var(--ink-dim); text-decoration: none; font-size: 14px;
    font-weight: 500; transition: color 0.2s;
  }
  .nav-right a:hover { color: var(--accent); }

  main {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: 70px 32px 60px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .lede { color: var(--ink-dim); font-size: 16px; margin-bottom: 36px; }

  .search-form {
    display: flex; gap: 10px; margin-bottom: 32px;
  }
  .search-form input {
    flex: 1;
    background: rgba(10, 16, 32, 0.6);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; font-weight: 500;
    padding: 14px 16px; border-radius: 4px;
    outline: none; text-transform: uppercase;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-form input::placeholder {
    color: rgba(138, 148, 173, 0.4);
    text-transform: none;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
  }
  .search-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 185, 95, 0.1);
  }
  .search-form button {
    padding: 0 26px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 4px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: all 0.25s ease;
  }
  .search-form button:hover {
    box-shadow: 0 0 24px var(--accent-glow);
    transform: translateY(-1px);
  }

  .result {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 32px 30px;
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .result .ticker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 600;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .result .price {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 56px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .result .currency {
    font-family: 'Inter', sans-serif;
    color: var(--ink-dim);
    font-size: 16px;
    font-weight: 500;
    margin-left: 10px;
  }

  .error {
    background: rgba(255, 107, 107, 0.08);
    border: 1px solid rgba(255, 107, 107, 0.35);
    color: var(--danger);
    padding: 16px 18px;
    border-radius: 6px;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    nav { padding: 18px 20px; }
    main { padding: 40px 20px; }
    .search-form { flex-direction: column; }
    .search-form button { padding: 14px; }
    .result .price { font-size: 44px; }
  }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('home') }}" class="brand">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Bull's Eye Logo">
    <span class="brand-text">BULL'S<span class="dot">.</span>EYE</span>
  </a>
  <div class="nav-right">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('logout') }}">Log out</a>
  </div>
</nav>

<main>
  <h1>Look up a stock</h1>
  <p class="lede">Enter a ticker symbol to see its current price.</p>

  <form class="search-form" method="GET" action="{{ url_for('search') }}">
    <input type="text" name="ticker" value="{{ ticker or '' }}" placeholder="e.g. AAPL, MSFT, TSLA" autocomplete="off" autofocus required>
    <button type="submit">Search</button>
  </form>

  {% if result %}
    <div class="result">
      <div class="ticker">{{ result.ticker }}</div>
      <div>
        <span class="price">{{ "%.2f"|format(result.price) }}</span><span class="currency">{{ result.currency }}</span>
      </div>
    </div>
  {% elif error %}
    <div class="error">{{ error }}</div>
  {% endif %}
</main>
</body>
</html>
