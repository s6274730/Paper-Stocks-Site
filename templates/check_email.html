<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Check your email — Bull's Eye</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1020;
    --ink: #e8ecf5;
    --ink-dim: #8a94ad;
    --accent: #25b95f;
    --accent-glow: rgba(37, 185, 95, 0.25);
    --line: rgba(138, 148, 173, 0.15);
    --panel: rgba(17, 25, 50, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', sans-serif; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    filter: blur(80px); top: -200px; left: -150px;
    z-index: 0; pointer-events: none;
  }
  nav {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 48px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  .brand img { width: 38px; height: 38px; }
  .brand-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
  .brand-text .dot { color: var(--accent); }
  main {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 60px 24px; min-height: calc(100vh - 85px);
  }
  .card {
    width: 100%; max-width: 460px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 44px 36px; text-align: center;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 22px;
    border-radius: 50%; background: rgba(37, 185, 95, 0.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 30px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 26px; margin-bottom: 12px; letter-spacing: -0.01em;
  }
  p { color: var(--ink-dim); font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
  .email { color: var(--ink); font-weight: 500; }
  .hint { font-size: 13px; margin-top: 18px; }
  .back {
    display: inline-block; margin-top: 28px; padding: 11px 22px;
    color: var(--ink); text-decoration: none; font-size: 14px;
    font-weight: 500; border: 1px solid var(--line); border-radius: 4px;
    transition: all 0.25s ease;
  }
  .back:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}" class="brand">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Bull's Eye Logo">
    <span class="brand-text">BULL'S<span class="dot">.</span>EYE</span>
  </a>
</nav>
<main>
  <div class="card">
    <div class="icon">✉</div>
    <h1>Check your inbox</h1>
    <p>We sent a confirmation link to</p>
    <p class="email">{{ email }}</p>
    <p class="hint">Click the link in the email to activate your account. The message can take a minute to arrive — also check spam.</p>
    <a href="{{ url_for('login') }}" class="back">Back to log in</a>
  </div>
</main>
</body>
</html>
